# Dashboard refresh: scan + optional Cloudflare deploy.
# GitHub Pages steps were removed — they fail with HttpError Not Found unless
# Repository → Settings → Pages → Build: GitHub Actions is enabled first.
#
# Prefer: workflow "Cloudflare auto update" for scheduled live site updates +
# repo secret CLOUDFLARE_API_TOKEN (see AUTO_UPDATE_SETUP.md).

name: Dashboard refresh (scan + artifact)

on:
  push:
    branches: [main, master]
  schedule:
    # UTC Mon–Fri, every 30m from 01:00–08:30 ≈ HK session 09:00–16:30
    - cron: "0,30 1-8 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_macro:
        description: "Also refresh macro_snapshot (大佬三原色)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Setup Node (Wrangler, optional Cloudflare)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: pip install -r requirements-scan.txt

      - name: Refresh dashboard JSON
        env:
          REFRESH_MACRO: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_macro == true && '1' || '' }}
        run: bash scripts/ci_refresh.sh

      - name: Validation summary (informational)
        run: python3 scripts/validate_scan_json.py || true

      - name: Upload refreshed site as artifact (7 days)
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dashboard-data-${{ github.run_id }}
          path: |
            frontend/data/*.json
            frontend/index.html
          retention-days: 7

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping Cloudflare: add repo secret CLOUDFLARE_API_TOKEN for auto-publish"
            exit 0
          fi
          python3 scripts/validate_scan_json.py
          cd cloudflare && npm ci
          cd ..
          bash scripts/deploy_cloudflare.sh
          echo "Live: https://hkstockdashboard.chrislau.workers.dev/frontend/"
