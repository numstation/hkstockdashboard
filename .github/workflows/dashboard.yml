# Dashboard refresh: scan + optional Cloudflare deploy.
#
# ⚠️ v3 — NO configure-pages / NO deploy-pages. If Actions still shows
#    "Get Pages site failed", GitHub does not have this file on main yet (push/sync).
#
# Prefer: workflow "Cloudflare auto update" for scheduled Cloudflare publishes +
# secret CLOUDFLARE_API_TOKEN (see AUTO_UPDATE_SETUP.md).

name: Dashboard refresh (scan + artifact)

on:
  push:
    branches: [main, master]
  schedule:
    # UTC Mon–Fri every 30m, 01:00–09:30 ≈ HK 09:00–17:30 (extra hour buffers GitHub cron delays)
    - cron: "0,30 1-9 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_macro:
        description: "Also refresh macro_snapshot (大佬三原色)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  scan-and-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Setup Node (Wrangler, optional Cloudflare)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: python3 -m pip install -r requirements-scan.txt

      - name: Refresh dashboard JSON
        env:
          REFRESH_MACRO: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_macro == true && '1' || '' }}
        run: bash scripts/ci_refresh.sh

      - name: Validation summary (informational)
        run: python3 scripts/validate_scan_json.py || true

      - name: Upload refreshed site as artifact (7 days)
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: dashboard-data-${{ github.run_id }}
          path: |
            frontend/data/*.json
            frontend/index.html
          retention-days: 7

      - name: Deploy to Cloudflare Workers
        env:
          DEPLOY_MARKET: hk
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REFRESH_PUBLIC_KEY: ${{ secrets.REFRESH_PUBLIC_KEY }}
          # Yahoo/rate limits in CI often dip below 50 data_ok; tune or unset for strict deploys.
          SCAN_VALIDATE_MIN_OK: "40"
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping Cloudflare: add repo secret CLOUDFLARE_API_TOKEN for auto-publish"
            exit 0
          fi
          python3 scripts/validate_scan_json.py
          DEPLOY_MARKET=hk bash scripts/deploy_cloudflare.sh
          echo "Live: https://hkstockdashboard.chrislau.workers.dev/frontend/"
