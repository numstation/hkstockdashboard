# Free hosting: GitHub Pages + scheduled data refresh (133 HK tickers, ~every 30m on weekdays).
name: Dashboard refresh & Pages deploy

on:
  push:
    branches: [main, master]
  schedule:
    # UTC Mon–Fri, every 30m from 01:00–08:30 ≈ HK session 09:00–16:30
    - cron: "0,30 1-8 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_macro:
        description: "Also refresh macro_snapshot (大佬三原色)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Install dependencies
        run: pip install -r requirements-scan.txt

      - name: Refresh dashboard JSON
        env:
          REFRESH_MACRO: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_macro == true && '1' || '' }}
        run: bash scripts/ci_refresh.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
