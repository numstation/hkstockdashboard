# US dashboard auto-update — separate schedule from HK (NYSE/Nasdaq regular hours).
# HK workflow: cloudflare-auto.yml (≈ HKT 09:00–16:30).
# This workflow: ≈ HKT 22:00–06:15 (covers US 09:30–16:00 Eastern in UTC).
# Cadence: ~35 min between scheduled starts (not 30) — US scan takes ~15–20 min for
# 300 tickers × 3 models; 30 min slots caused queue/backlog and 1h+ gaps on GitHub.

name: Cloudflare auto update (US)

on:
  schedule:
    # ~every 35 min, UTC 14:00–22:10 ≈ HKT 22:00–06:10 (Mon–Fri)
    # GitHub cron cannot do "*/35"; six lines = 0,35 / 10,45 / 20,55 minute cycle.
    - cron: "0 14-21 * * 1-5"
    - cron: "35 14-21 * * 1-5"
    - cron: "10 15-22 * * 1-5"
    - cron: "45 15-22 * * 1-5"
    - cron: "20 15-21 * * 1-5"
    - cron: "55 15-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: cloudflare-dashboard-deploy
  cancel-in-progress: false

jobs:
  scan-us-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCAN_VALIDATE_MIN_OK: "200"
      SCAN_VALIDATE_FILES: "daily_scan_us.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Setup Node (Wrangler)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-scan.txt

      - name: Scan US universe → JSON
        run: bash scripts/ci_refresh_us.sh

      - name: Validate US scan quality
        run: python3 scripts/validate_scan_json.py

      - name: Deploy to Cloudflare Workers
        env:
          DEPLOY_MARKET: us
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          DEPLOY_MARKET=both bash scripts/deploy_cloudflare.sh
          echo "Live US: https://hkstockdashboard.chrislau.workers.dev/frontend-us/"
