# US dashboard auto-update — separate schedule from HK (NYSE/Nasdaq regular hours).
# HK workflow: cloudflare-auto.yml (≈ HKT 09:00–16:30).
# This workflow: HKT 21:40–04:40 every 30 min (US cash open ≈ 21:30 HKT / 09:30 ET in EDT).

name: Cloudflare auto update (US)

on:
  schedule:
    # UTC 13:40 = HKT 21:40 (10 min after US open); then :10/:40 each hour until 20:40 UTC = 04:40 HKT
    - cron: "40 13 * * 1-5"
    - cron: "10,40 14-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: cloudflare-dashboard-deploy
  cancel-in-progress: false

jobs:
  scan-us-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCAN_VALIDATE_MIN_OK: "200"
      SCAN_VALIDATE_FILES: "daily_scan_us.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Setup Node (Wrangler)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-scan.txt

      - name: Scan US universe → JSON
        run: bash scripts/ci_refresh_us.sh

      - name: Validate US scan quality
        run: python3 scripts/validate_scan_json.py

      - name: Deploy to Cloudflare Workers
        env:
          DEPLOY_MARKET: us
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PAT: ${{ secrets.DASHBOARD_GITHUB_PAT }}
          REFRESH_PUBLIC_KEY: ${{ secrets.REFRESH_PUBLIC_KEY }}
          REFRESH_SECRET: ${{ secrets.REFRESH_PUBLIC_KEY }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          DEPLOY_MARKET=us bash scripts/deploy_cloudflare.sh
          echo "Live US: https://hkstockdashboard.chrislau.workers.dev/frontend-us/"
