# Auto-update live dashboard on Cloudflare (scan → validate → deploy).
# One-time setup: add repo secret CLOUDFLARE_API_TOKEN (see DEPLOY_CLOUDFLARE.md).

name: Cloudflare auto update

on:
  schedule:
    # UTC Mon–Fri every 30m, 01:00–08:30 ≈ HK 09:00–16:30
    - cron: "0,30 1-8 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_macro:
        description: "Also refresh macro_snapshot"
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudflare-dashboard
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Setup Node (Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-scan.txt

      - name: Scan HK universe → JSON
        run: bash scripts/ci_refresh.sh
        env:
          REFRESH_MACRO: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_macro == true && '1' || '' }}

      - name: Validate scan quality (block bad deploys)
        run: python3 scripts/validate_scan_json.py

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN — site will NOT auto-update."
            echo "See DEPLOY_CLOUDFLARE.md → Automate section."
            exit 1
          fi
          cd cloudflare && npm ci
          cd ..
          bash scripts/deploy_cloudflare.sh
          echo "Live: https://hkstockdashboard.chrislau.workers.dev/frontend/"
