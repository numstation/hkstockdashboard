# Cloudflare Workers — static dashboard + /api/refresh on-demand scan
# Deploy: bash ../scripts/deploy_cloudflare.sh

name = "hkstockdashboard"
# Chrislau@numstation.com's Account. The deploy token can also see a second
# account ("Noon Sofa"); non-interactive wrangler aborts unless this is set.
# Keep in sync with CLOUDFLARE_ACCOUNT_ID in the deploy workflows.
account_id = "00de92daaee5095fa3ba77cb45d94d57"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "numstation/hkstockdashboard"
REFRESH_COOLDOWN_MIN = "10"
ANALYSIS_API_URL = "https://web-production-c9abe.up.railway.app"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Wrangler 3.x requires boolean (array patterns need wrangler 4+).
run_worker_first = true
