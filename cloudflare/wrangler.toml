# Cloudflare Workers — static dashboard + /api/refresh on-demand scan
# Deploy: bash ../scripts/deploy_cloudflare.sh

name = "hkstockdashboard"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "numstation/hkstockdashboard"
REFRESH_COOLDOWN_MIN = "10"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
